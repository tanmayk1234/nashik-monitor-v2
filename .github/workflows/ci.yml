name: CI

on:
  push:
    branches: [master]
  pull_request:

# Typecheck, the format-export assertions and a production build. The two
# browser checks in scripts/ are deliberately not here: both need the live
# OpenFreeMap tiles, so a network hiccup would fail the build for no reason.
# Run them locally against `npm run dev`.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
